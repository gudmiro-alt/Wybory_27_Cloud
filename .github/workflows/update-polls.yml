name: Aktualizuj sondaże
on:
  schedule: [{cron: "17 */2 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 numpy
      - run: python scripts/fetch_polls.py
      - run: python scripts/collect_polls.py
        if: always()
      - run: python scripts/model.py polls.json
        if: always()
      - if: always()
        run: |
          git config user.name "poll-bot"
          git config user.email "poll-bot@users.noreply.github.com"
          git add data.json || true
          git add polls.json polls_report.md forecast.json forecast_history.json || true
          git diff --cached --quiet || (git commit -m "Aktualizacja sondaży" && git push)
